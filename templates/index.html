<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Sudoku Game</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <h1>Sudoku Game</h1>
  <div id="sudoku-board"></div>
  <div class="controls">
    <button id="new-game">New Game</button>
    <button id="start-game">Start</button>
    <label for="dark-toggle" class="visually-hidden">Dark Mode</label>
    <label class="toggle">
      <input id="dark-toggle" type="checkbox" />
      <span>Dark Mode</span>
    </label>
    <label for="player-name">Player:</label>
    <input id="player-name" type="text" placeholder="Your name" maxlength="32" />
    <label for="difficulty-select">Difficulty:</label>
    <select id="difficulty-select">
      <option value="easy">Easy</option>
      <option value="medium" selected>Medium</option>
      <option value="hard">Hard</option>
    </select>
    <button id="hint-button">Hint</button>
    <button id="check-solution">Check Solution</button>
    <span id="message"></span>
    <span id="timer" class="timer">00:00</span>
  </div>

  <div id="leaderboard" class="leaderboard">
    <h2>Top 10 Leaderboard</h2>
    <table id="leaderboard-table">
      <thead>
        <tr>
          <th>Rank</th>
          <th>Player</th>
          <th>Time</th>
          <th>Difficulty</th>
          <th>Hints</th>
        </tr>
      </thead>
      <tbody>
        <!-- Leaderboard rows injected by JS -->
      </tbody>
    </table>
  </div>
  <script src="/static/main.js"></script>
</body>
</html>
